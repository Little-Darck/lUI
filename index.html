<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis páginas</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0f172a;
      --surface: #1e293b;
      --border: #334155;
      --accent: #39a900;
      --text: #f1f5f9;
      --muted: #a7b3c5;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(57, 169, 0, 0.16), transparent 35rem),
        var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    main {
      width: min(760px, 100%);
    }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: clamp(2rem, 7vw, 3.4rem);
    }

    .subtitle {
      margin: 0 0 28px;
      color: var(--muted);
      text-align: center;
    }

    nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .page-card {
      min-height: 190px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: space-between;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      color: inherit;
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    .page-card:hover,
    .page-card:focus-visible {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 12px 30px rgba(57, 169, 0, 0.16);
      outline: none;
    }

    .number {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: #10200b;
      font-weight: 800;
    }

    .page-name {
      margin-top: 24px;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .open {
      color: #a5e57c;
      font-weight: 700;
    }

    @media (max-width: 680px) {
      nav { grid-template-columns: 1fr; }
      .page-card { min-height: 150px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Mis páginas</h1>
    <p class="subtitle">Selecciona una página para abrirla.</p>
    <nav aria-label="Páginas disponibles">
      <a class="page-card" href="./compe.html">
        <span class="number">1</span>
        <span class="page-name">Portafolio de Competencias SENA</span>
        <span class="open">Abrir página →</span>
      </a>
      <a class="page-card" href="./Pagin.html">
        <span class="number">2</span>
        <span class="page-name">Mi primera página</span>
        <span class="open">Abrir página →</span>
      </a>
      <a class="page-card" href="./pagina2.html">
        <span class="number">3</span>
        <span class="page-name">Página 2</span>
        <span class="open">Abrir página →</span>
      </a>
    </nav>
  </main>
</body>
</html>
